/**
 * 점검 제출 (H-12)
 *  1) 무조건 대기함에 먼저 저장 — 어떤 경우에도 입력 내용이 사라지지 않게 하는 안전망
 *  2) 오프라인이면 여기서 종료 (연결되면 자동 전송)
 *  3) 온라인이면 서버 응답을 "기다려서" 성공/실패를 명확히 알려줌
 *
 * ⚠️ 이전에는 온라인이어도 "대기함에 저장되었습니다"만 뜨고 모달이 닫혔습니다.
 *    뒤에서 도는 전송이 실패해도 조용히 넘어가서, 점검원은 제출됐다고 믿는데
 *    서버에는 기록이 없는 상황이 생길 수 있었습니다.
 */
async function submitForm() {
  const d = collectFormData();
  if (!d.점검일자) return toast('점검일자를 입력하세요');

  // 필수 사진 검증 (H-4)
  //  현장 흐름을 끊지 않도록 확인창은 띄우지 않습니다.
  //  제출은 그대로 진행하고, 부족 내역만 서버 「검토메모」에 남겨 관리자가 확인합니다.
  const shortage = validateRequiredPhotos();
  if (shortage.length) d.photoShortage = shortage;

  // 수정 모드는 별도 경로 — 대기함을 거치지 않고 서버 행을 직접 갱신합니다
  if (S.editing && S.editing.inspId) return submitEdit(d);

  setSubmitBusy(true, '저장 중...');
  try {
    // 1) 로컬 대기함에 저장 — 이게 성공해야 데이터가 안전합니다
    const saved = await saveInspectionToOfflineQueue(d);
    if (!saved) {
      // ⚠️ 저장 실패인데 초안을 지우면 입력이 통째로 사라집니다.
      //    초안을 그대로 두고 사용자에게 알립니다.
      showSubmitFailBox({ error: '기기에 저장하지 못했습니다. 저장공간을 확인하고 다시 시도해 주세요.' });
      return;
    }

    // 2) 저장이 확인된 뒤에만 작성 중 초안을 정리합니다
    await deleteDraft(d.no);

    // 3) 화면은 즉시 놓아줍니다 — 다음 점검을 바로 시작할 수 있어야 합니다.
    //    서버 전송은 백그라운드에서 진행되고, 결과는 「내 점검」과 토스트로 알립니다.
    closeModal();
    toast(S.isOnline
      ? '📤 제출 접수 — 전송은 백그라운드에서 진행됩니다'
      : '📡 오프라인 — 연결되면 자동 전송됩니다', 3000);

    if (S.isOnline) {
      // await 하지 않습니다. 기다리면 다음 점검이 막힙니다.
      setTimeout(function () { autoFlushSubmits(false); }, 300);
    }
  } catch (err) {
    console.warn('제출 처리 중 오류:', err);
    showSubmitFailBox({ error: err && err.message ? err.message : String(err) });
  } finally {
    setSubmitBusy(false);
  }
}

// S.photoMap 에 담긴 사진을 업로드용 배열로 변환
function collectPhotoPayload(d) {
  const out = [];
  const site = S.currentSite || {};
  const isThermal = (S.inspTypes || []).indexOf('열화상촬영') >= 0;
  Object.entries(S.photoMap || {}).forEach(([itemId, list]) => {
    (list || []).forEach(ph => {
      out.push({
        base64: ph.base64,
        filename: ph.filename || `photo_${Date.now()}.jpg`,
        no: d.no || site.no || '',
        설비명칭: d.설비명칭 || site.name || '미지정',
        itemId: itemId,
        itemName: ph.label || getCheckItemLabel(itemId),
        uploader: d.점검자 || S.user?.name || '',
        photoType: (/thermal/i.test(itemId) || isThermal) ? '열화상촬영' : ''
      });
    });
  });
  return out;
}

/**
 * 제출된 점검 수정 저장
 *  · 서버의 같은 행을 덮어씁니다 (수정일시·수정자 기록)
 *  · 새로 추가한 사진만 업로드하고 기존 사진은 건드리지 않습니다
 */
async function submitEdit(d) {
  if (!S.isOnline) { toast('수정은 온라인에서만 가능합니다.'); return; }

  setSubmitBusy(true, '수정 저장 중...');
  try {
    d.inspId = S.editing.inspId;
    const r = await api('updateInspection', d);
    if (!r || !r.success) { showSubmitFailBox(r); return; }

    // 새로 추가한 사진만 업로드
    let pOk = 0, pFail = 0;
    const photos = collectPhotoPayload(d);
    if (photos.length) {
      setSubmitBusy(true, `사진 ${photos.length}장 업로드 중...`);
      for (const ph of photos) {
        ph.inspId = r.inspId;
        const pr = await api('uploadPhoto', ph);
        if (pr && pr.success) pOk++; else pFail++;
      }
    }

    let msg = `✅ 수정 저장 완료 (${r.inspId})`;
    if (pOk > 0)   msg += ` · 사진 ${pOk}장 추가`;
    if (pFail > 0) msg += ` · ⚠️ ${pFail}장 실패`;
    toast(msg, 5000);

    S.editing = null;
    S.photoMap = {};
    closeModal();
  } catch (err) {
    console.warn('수정 저장 오류:', err);
    showSubmitFailBox({ error: err && err.message ? err.message : String(err) });
  } finally {
    setSubmitBusy(false);
  }
}

// 전송 실패 안내 + 재시도
function showSubmitFailBox(r) {
  let box = document.getElementById('submitFailBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'submitFailBox';
    box.style.cssText = 'display:none;position:fixed;inset:0;z-index:99997;'
      + 'background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:1rem;';
    document.body.appendChild(box);
  }
  const detail = (r && r.error) ? String(r.error).slice(0, 200) : '';
  box.innerHTML =
      '<div style="background:#fff;border-radius:14px;padding:1.2rem;max-width:340px;width:100%;">'
    + '<div style="font-weight:700;color:var(--ng);margin-bottom:.6rem;">⚠️ 서버 전송 실패</div>'
    + '<div style="font-size:.88rem;color:#334155;line-height:1.55;margin-bottom:.9rem;">'
    + '입력하신 내용은 <b>대기함에 안전하게 저장</b>되어 있습니다.<br>'
    + '다시 시도하시거나, 나중에 자동 전송되도록 두셔도 됩니다.'
    + (detail ? '<div style="margin-top:.6rem;font-size:.78rem;color:var(--muted);word-break:break-all;">' + detail + '</div>' : '')
    + '</div>'
    + '<button type="button" class="btn btn-pri" onclick="retrySubmit()">🔄 다시 시도</button>'
    + '<button type="button" class="btn btn-out" onclick="submitFailClose()">나중에 (대기함 보관)</button>'
    + '</div>';
  box.style.display = 'flex';
}

function submitFailClose() {
  const box = document.getElementById('submitFailBox');
  if (box) box.style.display = 'none';
  toast('📡 대기함에 보관했습니다. 연결이 안정되면 자동 전송됩니다.');
  closeModal();
}

async function retrySubmit() {
  const box = document.getElementById('submitFailBox');
  if (box) box.style.display = 'none';

  // 수정 모드는 대기함이 아니라 서버 행 갱신을 다시 시도합니다
  if (S.editing && S.editing.inspId) return submitEdit(collectFormData());

  setSubmitBusy(true, '다시 전송 중...');
  try {
    const r = await autoFlushSubmits(true);
    if (r && r.ok > 0 && r.fail === 0) {
      toast(`✅ 제출 완료${r.lastInspId ? ' (' + r.lastInspId + ')' : ''}`, 5000);
      closeModal();
    } else {
      showSubmitFailBox(r);
    }
  } finally {
    setSubmitBusy(false);
  }
}

async function saveInspectionToOfflineQueue(d) {
  const photos = [];
  const site = S.currentSite || {};
  const siteName = d.설비명칭 || site.name || '미지정';
  const siteNo = d.no || site.no || '';
  const uploaderName = d.점검자 || S.user?.name || '';
  const isThermal = (S.inspTypes || []).indexOf('열화상촬영') >= 0;

  if (S.photoMap) {
    Object.entries(S.photoMap).forEach(([itemId, list]) => {
      (list || []).forEach(ph => {
        const isItemThermal = /thermal/i.test(itemId) || isThermal;
        const labelStr = ph.label || getCheckItemLabel(itemId);
        photos.push({
          base64: ph.base64,
          filename: ph.filename || `photo_${Date.now()}.jpg`,
          no: siteNo,
          설비명칭: siteName,
          itemId: itemId,
          itemName: labelStr,
          uploader: uploaderName,
          photoType: isItemThermal ? '열화상촬영' : ''
        });
      });
    });
  }

  // 중복 저장 방지: 해당 발전소(d.no)의 기존 대기 기록 청소 후 최신 1건 유지
  try {
    const items = (await withIdb(db => new Promise(res => {
      const req = db.transaction(IDB_SUBMIT, 'readonly').objectStore(IDB_SUBMIT).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => res([]);
    }))) || [];
    const sameSiteItems = items.filter(it => it.payload?.data?.no == d.no);
    if (sameSiteItems.length > 0) {
      await withIdb(db => new Promise(res => {
        const tx = db.transaction(IDB_SUBMIT, 'readwrite');
        const store = tx.objectStore(IDB_SUBMIT);
        sameSiteItems.forEach(it => store.delete(it.id));
        tx.oncomplete = res; tx.onerror = res;
      }));
    }
  } catch(e) { console.warn('대기함 중복 정제 실패', e); }

  const queueObj = { payload: { data: d, photos: photos }, createdAt: Date.now() };

  const saved = await withIdb(db => new Promise(res => {
    const tx = db.transaction(IDB_SUBMIT, 'readwrite');
    tx.objectStore(IDB_SUBMIT).add(queueObj);
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  }));

  // ⚠️ 여기서 toast/closeModal 을 하지 않습니다. (H-12)
  //    이 함수는 "로컬 저장"만 담당하고, 사용자에게 무엇을 보여줄지는
  //    서버 전송 결과를 아는 submitForm() 이 판단합니다.
  return saved;
}



async function saveLocal() {
  const d = collectFormData();
  const key = `draft_${d.no}_${d.점검일자}_${Date.now()}`;
  localStorage.setItem(key, JSON.stringify(d));
  toast('💾 임시 저장됨');
}
// ── 사진 탭 제거 (H-3) ──────────────────────────────────
// renderPhotoSection / addTabPhoto / previewPhotos / uploadAllPhotos 를 삭제했습니다.
// 모달 탭바가 항상 숨겨져 있어 사진 탭에 도달할 수 없었고,
// 기능도 점검폼 안의 「항목별 사진」·「추가사진」과 중복이었습니다.
// 사진 업로드는 제출 시 autoFlushSubmits() / submitEdit() 경로가 담당합니다.

// saveQueueToDB() 도 함께 삭제했습니다 — 유일한 호출자가 uploadAllPhotos() 였습니다.
// 그 결과 photoQ 스토어에는 더 이상 아무것도 쌓이지 않으므로
// 화면 상단의 「대기 사진」 바(queueBar)는 항상 숨겨진 상태가 됩니다.
// 사진은 점검 제출 시 대기함(submitQ)에 함께 담겨 전송됩니다.

async function flushQueue() {
  if (!S.isOnline) return toast('WiFi 연결 필요');
  const items = (await withIdb(db => new Promise(res => {
    const req = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAll();
    req.onsuccess = () => res((req.result || []).filter(i=>i.status==='pending'));
    req.onerror = () => res([]);
  }))) || [];
  if (!items.length) return toast('대기 사진 없음');
  const r = await api('flushPhotoQueue', {queue: items});
  await withIdb(db => new Promise(res => {
    const tx = db.transaction(IDB_STORE,'readwrite');
    items.forEach(i => tx.objectStore(IDB_STORE).delete(i.id));
    tx.oncomplete = res; tx.onerror = res;
  }));
  document.getElementById('queueBar').classList.remove('show');
  toast(`✅ ${r?.uploaded||items.length}장 업로드 완료`);
}
function switchTab(name) {
  ['list','mine','admin'].forEach(t => {
    document.getElementById(`pane-${t}`)?.classList.toggle('active', t===name);
  });
  document.querySelectorAll('.tabs .tab').forEach((el, i) => {
    el.classList.toggle('active', ['list','mine','admin'][i]===name);
  });
  if (name === 'form') buildForm(currentInspType);
  if (name === 'admin') { loadCommonNotice(); loadAdminSummary(); }
  if (name === 'mine') loadMineSummary();
}

// ── 이번 달 점검 현황 (내 점검) ──
async function loadMineSummary() {
  const el = document.getElementById('mineList');
  if (!el) return;
  el.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--muted);"><span class="spin"></span> 불러오는 중...</div>';
  // 이 기기의 임시저장·전송대기 현황을 먼저 보여줍니다 (점검원 본인이 확인해야 할 정보)
  const device = await renderDeviceStatus();
  const r = await api('getMonthlySummary', {});
  const list = Array.isArray(r) ? r : [];
  const mine = list.filter(s => !S.user?.name || s.manager === S.user.name);
  const rows = (S.user?.role === '관리자' && mine.length === 0) ? list : mine;
  if (!rows.length) { el.innerHTML = device + '<div style="padding:1rem;text-align:center;color:var(--muted);">데이터 없음</div>'; return; }
  el.innerHTML = device + rows.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--border);font-size:.88rem;">
      <div>
        <div style="font-weight:600;">${s.name}</div>
        <div style="font-size:.78rem;color:var(--muted);">${s.lastDate ? '최근 '+s.lastDate : '이번 달 점검 없음'}</div>
      </div>
      <span class="badge" style="background:${s.missing>0?'#fee2e2':'#dcfce7'};color:${s.missing>0?'#991b1b':'#166534'};">
        ${s.done}/${s.required}회
      </span>
    </div>`).join('');
}

// ── 관리자 월간 현황 ──
// ── 이 기기 상태 (임시저장 · 전송 대기) ──────────────────
// 점검원 본인이 확인해야 하는 정보입니다. 「내 점검」 탭에 표시합니다.

async function listStore(storeName) {
  try {
    return (await withIdb(db => new Promise(res => {
      const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => res([]);
    }))) || [];
  } catch (_) { return []; }
}

function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function renderDeviceStatus() {
  const drafts  = await listStore(IDB_DRAFT);
  const pending = await listStore(IDB_SUBMIT);
  const info    = await getStorageInfo();

  let html = '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;'
           + 'padding:.75rem .85rem;margin-bottom:.75rem;font-size:.85rem;color:#334155;">'
           + '<div style="font-weight:700;margin-bottom:.5rem;">📱 이 기기 상태</div>';

  // 전송 대기 — 가장 중요합니다. 아직 서버에 없는 점검입니다.
  if (pending.length) {
    html += '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:.55rem .7rem;margin-bottom:.5rem;">'
          + `<div style="color:#b45309;font-weight:700;">⏳ 전송 대기 ${pending.length}건</div>`
          + '<div style="font-size:.8rem;color:#78350f;margin-top:.2rem;line-height:1.5;">'
          + pending.map(p => `· ${p.payload?.data?.설비명칭 || '(이름없음)'} <span style="color:var(--muted);">${fmtWhen(p.createdAt)}</span>`).join('<br>')
          + '</div>'
          + '<button type="button" class="btn btn-pri btn-sm" style="width:100%;margin-top:.5rem;" onclick="flushPendingNow()">📤 지금 전송</button>'
          + '</div>';
  }

  // 작성 중 임시저장 — 탭하면 이어서 작성
  if (drafts.length) {
    html += '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:.55rem .7rem;margin-bottom:.5rem;">'
          + `<div style="color:#1d4ed8;font-weight:700;">📝 작성 중 ${drafts.length}건</div>`
          + '<div style="font-size:.8rem;margin-top:.2rem;line-height:1.7;">'
          + drafts.map(d => {
              const cnt = Object.keys(d.photos || {}).reduce((a, k) => a + (d.photos[k] || []).length, 0);
              return `· <a href="javascript:void(0)" onclick="openSite('${d.no}')" style="color:#1d4ed8;font-weight:600;">${d.설비명칭 || d.no}</a>`
                   + ` <span style="color:var(--muted);">${fmtWhen(d.savedAt)}${cnt ? ' · 사진 ' + cnt + '장' : ''}</span>`;
            }).join('<br>')
          + '</div></div>';
  }

  if (!pending.length && !drafts.length) {
    html += '<div style="color:var(--ok);">✅ 모두 전송 완료 · 작성 중인 점검 없음</div>';
  }

  // 저장 공간
  if (info && info.quota) {
    const pct = (info.usage / info.quota) * 100;
    html += `<div style="font-size:.78rem;color:var(--muted);margin-top:.5rem;">`
          + `저장공간 ${fmtSize(info.usage)} / ${fmtSize(info.quota)} (${pct.toFixed(1)}%)</div>`;
    if (pct > 80) {
      html += '<div style="color:var(--ng);font-weight:700;font-size:.8rem;margin-top:.3rem;">'
            + '⚠️ 저장 공간이 부족합니다. 대기 중인 제출을 먼저 전송해 주세요.</div>';
    }
  }

  return html + '</div>';
}

// 「지금 전송」 버튼
async function flushPendingNow() {
  if (!S.isOnline) return toast('인터넷 연결이 필요합니다.');
  toast('전송 중...');

  let r = await autoFlushSubmits(true);

  // ⚠️ 연결이 복구되면 자동 전송이 먼저 시작됩니다.
  //    그때 버튼을 누르면 이미 실행 중이라 건너뛰는데, 예전에는 그걸
  //    "전송할 항목이 없습니다"로 잘못 안내했습니다.
  if (r && r.skipped && r.error !== '오프라인') {
    toast('이미 전송 중입니다. 잠시만 기다려 주세요...', 3000);
    for (let i = 0; i < 20 && r.skipped; i++) {      // 최대 20초 대기
      await new Promise(res => setTimeout(res, 1000));
      r = await autoFlushSubmits(true);
    }
  }

  if (r && r.ok > 0 && r.fail === 0)      toast(`✅ ${r.ok}건 전송 완료`);
  else if (r && r.fail > 0)               toast(`⚠️ ${r.ok}건 성공, ${r.fail}건 실패 — 잠시 후 다시 시도해 주세요`, 5000);
  else if (r && r.skipped)                toast('전송이 진행 중입니다. 잠시 후 다시 확인해 주세요.', 4000);
  else                                    toast('전송할 항목이 없습니다.');

  loadMineSummary();   // 목록 갱신
}

async function loadAdminSummary() {
  const el = document.getElementById('adminContent');
  if (!el) return;
  el.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--muted);"><span class="spin"></span> 불러오는 중...</div>';
  const r = await api('getMonthlySummary', {});
  const list = Array.isArray(r) ? r : [];
  if (!list.length) { el.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--muted);">데이터 없음</div>'; return; }

  S.adminSummary = list;

  // 담당자별로 묶습니다 — 전체 나열은 한눈에 안 들어옵니다
  const groups = {};
  list.forEach(s => {
    const m = String(s.manager || '').trim() || '(미배정)';
    (groups[m] = groups[m] || []).push(s);
  });

  // 미완료가 많은 담당자를 위로
  const names = Object.keys(groups).sort((a, b) => {
    const ra = groups[a].filter(x => x.missing > 0).length;
    const rb = groups[b].filter(x => x.missing > 0).length;
    return rb - ra || a.localeCompare(b);
  });

  const doneAll = list.filter(s => s.missing === 0).length;
  let html = `<div style="font-size:.88rem;margin-bottom:.6rem;">
      전체 <b>${doneAll}</b> / <b>${list.length}</b>개소 완료
      <span style="color:var(--muted);">· 담당자 ${names.length}명</span>
    </div>`;

  names.forEach((mgr, gi) => {
    const g    = groups[mgr];
    const done = g.filter(s => s.missing === 0).length;
    const pct  = g.length ? Math.round(done / g.length * 100) : 0;
    const left = g.length - done;
    const bar  = pct === 100 ? 'var(--ok)' : (pct >= 50 ? 'var(--pri)' : 'var(--warn)');

    html += `<div style="border:1.5px solid var(--border);border-radius:10px;margin-bottom:.5rem;overflow:hidden;">
      <div onclick="toggleMgr(${gi})" style="padding:.65rem .8rem;cursor:pointer;background:#f8fafc;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:700;font-size:.92rem;">${mgr}</span>
          <span style="font-size:.82rem;">
            <b style="color:${left ? 'var(--ng)' : 'var(--ok)'};">${done}</b>/${g.length}개소
            <span id="mgrArrow_${gi}" style="color:var(--muted);margin-left:.3rem;">▼</span>
          </span>
        </div>
        <div style="height:6px;background:#e2e8f0;border-radius:3px;margin-top:.45rem;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${bar};"></div>
        </div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:.3rem;">
          ${left ? `미완료 ${left}개소` : '모두 완료'}
        </div>
      </div>
      <div id="mgrBody_${gi}" style="display:none;padding:.2rem .8rem .5rem;">`;

    // 미완료를 위로
    g.sort((a, b) => (b.missing - a.missing) || String(a.name).localeCompare(String(b.name)));
    g.forEach(s => {
      const ng = Number(s.이상항목수) || 0;
      html += `<div style="display:flex;justify-content:space-between;align-items:center;
                    padding:.45rem .1rem;border-bottom:1px solid #f1f5f9;font-size:.85rem;">
          <div style="min-width:0;">
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:.74rem;color:var(--muted);">
              ${s.lastDate || '미점검'}${ng ? ` · <span style="color:var(--ng);">이상 ${ng}</span>` : ''}
            </div>
          </div>
          <span class="badge" style="background:${s.missing > 0 ? '#fee2e2' : '#dcfce7'};color:${s.missing > 0 ? '#991b1b' : '#166534'};">
            ${s.done}/${s.required}
          </span>
        </div>`;
    });
    html += `</div></div>`;
  });

  el.innerHTML = html;
}

// 담당자 아코디언 열고 닫기
function toggleMgr(gi) {
  const body  = document.getElementById('mgrBody_' + gi);
  const arrow = document.getElementById('mgrArrow_' + gi);
  if (!body) return;
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  if (arrow) arrow.textContent = open ? '▲' : '▼';
}

function switchMTab(name) {
  // 사진 탭 제거 후 기본정보 / 점검폼 2개만 남았습니다 (H-3)
  ['info','form'].forEach(t => {
    document.getElementById(`mt-${t}`)?.classList.toggle('active', t===name);
  });
  if (name === 'form' && !document.getElementById('formEl').innerHTML) {
    buildForm(currentInspType);
  }
}
/* ══════════════════════════════════════════════════════════
   서버와 이야기하는 부분  (PWA 빌드에서 교체된 곳)

   예전 : 구글이 만들어준 전용 통로 (google 스크립트 런).
          앱이 구글 안에 있을 때만 쓸 수 있었습니다.
   지금 : fetch — 보통의 인터넷 요청.
          앱이 어디에 있든 쓸 수 있습니다.

   세 가지가 중요합니다.
     ① Content-Type 을 text/plain 으로 보냅니다
        → 브라우저가 「단순 요청」으로 보고 그냥 통과시킵니다(CORS 우회).
          application/json 으로 보내면 사전확인 요청이 먼저 날아가는데,
          Apps Script 는 거기에 답할 수 없어 실패합니다.
     ② 시간제한을 둡니다
        → 신호가 약한 현장에서 영영 기다리는 일을 막습니다. 예전엔 없었습니다.
     ③ 토큰을 자동으로 싣습니다
        → 서버(버전 56)가 토큰 없는 요청을 거부합니다.
   ══════════════════════════════════════════════════════════ */

const API_URL    = 'https://script.google.com/macros/s/AKfycbykuZDhMNZ_IRjpJ6M712nNMPx4_uV_ky5o8ZOwlf5WhU38hRMI4zy47O5pFYlklKefWQ/exec';
const TIMEOUT_MS = 15000;
const TOKEN_KEY  = 'sky_token';

/** 지금 쓸 수 있는 토큰을 찾습니다 (로그인 결과 → 저장된 값 → 주소의 ?token=) */
function currentToken() {
  if (S.user && S.user.token) return S.user.token;
  try { const t = localStorage.getItem(TOKEN_KEY); if (t) return t; } catch (_) {}
  return (typeof INJECTED_TOKEN !== 'undefined' && INJECTED_TOKEN) ? INJECTED_TOKEN : '';
}

/** 토큰이 죽었을 때 — 저장된 값을 지우고 로그인 화면으로 되돌립니다 */
function forceRelogin(msg) {
  try { localStorage.removeItem(TOKEN_KEY); } catch (_) {}
  S.user = null;
  const w = document.getElementById('loginWrap');
  const m = document.getElementById('mainApp');
  if (w) w.style.display = '';
  if (m) m.style.display = 'none';
  if (typeof toast === 'function') toast(msg || '다시 로그인해 주세요');
}

async function api(action, params = {}) {
  const body = { action, ...params };
  const tok  = currentToken();
  if (tok && !body.token) body.token = tok;

  const ac    = new AbortController();
  const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);

  try {
    const res = await fetch(API_URL, {
      method  : 'POST',
      headers : { 'Content-Type': 'text/plain;charset=utf-8' },   /* ★ ① */
      body    : JSON.stringify(body),
      redirect: 'follow',                                          /* 구글이 한 번 넘깁니다 */
      signal  : ac.signal                                          /* ★ ② */
    });

    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (_) {
      console.error(action, 'JSON 이 아닌 응답', text.slice(0, 200));
      return null;
    }

    if (json && json.needLogin) { forceRelogin(json.error); return null; }
    return json;

  } catch (e) {
    /* 시간 초과·연결 실패 — 예전과 같은 값(null)을 돌려줍니다.
       기존 오프라인 처리가 그대로 동작하도록 하기 위함입니다. */
    if (e.name === 'AbortError') console.warn(action, `응답 없음 (${TIMEOUT_MS / 1000}초 초과)`);
    else                         console.warn(action, '통신 실패', e.message);
    return null;
  } finally {
    clearTimeout(timer);
  }
}
/* localMock (더미데이터) — PWA 빌드에서 제외됨 */

function toast(msg, ms=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}
</script>
<script>
/* ── 서비스 워커 등록 ───────────────────────────────────────
   이걸 등록해야 앱이 휴대폰 안에 담기고, 통신 없이도 켜집니다.
   ⚠️ https:// 또는 localhost 에서만 동작합니다.
      파일을 그냥 더블클릭해서 열면(file://) 등록되지 않습니다 — 정상입니다.
   ───────────────────────────────────────────────────────── */
(function () {
  var BUILD = '20260816-1824';
  console.log('앱 버전', BUILD);

  if (!('serviceWorker' in navigator)) return;
  var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!ok) { console.log('서비스 워커 생략 — https 가 아닙니다 (' + location.protocol + ')'); return; }

  /* 이미 담겨 있는 상태에서 새 버전으로 갈리면 알려줍니다 */
  var had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (had && typeof toast === 'function') toast('🔄 새 버전이 준비됐습니다. 앱을 다시 켜주세요');
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js')
      .then(function (r) { console.log('서비스 워커 등록됨', r.scope); })
      .catch(function (e) { console.warn('서비스 워커 등록 실패', e.message); });
  });
})();
</script>
